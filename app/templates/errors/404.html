{% extends 'base.html' %}
{% block title %}Not Found{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="bi bi-compass" style="font-size: 3rem; color: var(--brand-color);"></i>
    <h3 class="mt-3">404 - Page Not Found</h3>
    <p class="text-muted">The page you're looking for doesn't exist.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn brand-btn text-white">Back to Dashboard</a>
</div>
{% endblock %}
{% block auth_content %}
<div class="auth-wrapper"><div class="auth-card text-center">
    <h3>404 - Page Not Found</h3>
    <a href="{{ url_for('auth.login') }}" class="btn brand-btn text-white">Login</a>
</div></div>
{% endblock %}
