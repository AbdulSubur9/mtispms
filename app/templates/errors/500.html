{% extends 'base.html' %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="bi bi-exclamation-triangle" style="font-size: 3rem; color: #d9534f;"></i>
    <h3 class="mt-3">500 - Something Went Wrong</h3>
    <p class="text-muted">An unexpected error occurred. Please try again.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn brand-btn text-white">Back to Dashboard</a>
</div>
{% endblock %}
{% block auth_content %}
<div class="auth-wrapper"><div class="auth-card text-center">
    <h3>500 - Something Went Wrong</h3>
    <a href="{{ url_for('auth.login') }}" class="btn brand-btn text-white">Login</a>
</div></div>
{% endblock %}
