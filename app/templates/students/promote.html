{% extends 'base.html' %}{% block title %}Student Promotion{% endblock %}{% block content %}<div class='d-flex justify-content-between align-items-center mb-4'><h2 class='h4 mb-0'><i class='bi bi-arrow-up-circle me-2'></i>Student Promotion</h2></div><div class='card shadow-sm'><div class='card-body'><form method='POST' id='promotionForm'><input type='hidden' name='csrf_token' value='{{ csrf_token() }}'><div class='row mb-3'><div class='col-md-4'><label class='form-label'>From Class</label><select name='from_class_id' class='form-select' id='fromClass' required><option value=''>Select class...</option>{% for c in classes %}<option value='{{ c.id }}'>{{ c.name }}</option>{% endfor %}</select></div><div class='col-md-4'><label class='form-label'>To Class</label><select name='to_class_id' class='form-select' required><option value=''>Select class...</option>{% for c in classes %}<option value='{{ c.id }}'>{{ c.name }}</option>{% endfor %}</select></div><div class='col-md-4'><label class='form-label'>Academic Year</label><select name='academic_year_id' class='form-select' required><option value=''>Select year...</option>{% for y in years %}<option value='{{ y.id }}'>{{ y.name }}{% if y.is_current %} (Current){% endif %}</option>{% endfor %}</select></div></div><div id='studentsContainer' class='mb-3'><div class='alert alert-secondary'>Select a source class to load students.</div></div><div class='d-flex justify-content-between'><a href='{{ url_for('students.list_students') }}' class='btn btn-outline-secondary'>Cancel</a><div><button type='submit' name='action' value='promote' class='btn btn-success me-2'>Promote Selected</button><button type='submit' name='action' value='repeat' class='btn btn-warning me-2'>Repeat Selected</button><button type='submit' name='action' value='graduate' class='btn btn-info'>Graduate Selected</button></div></div></form></div></div><script>document.getElementById('fromClass').addEventListener('change',function(){const classId=this.value;const container=document.getElementById('studentsContainer');if(!classId){container.innerHTML='<div class=alert alert-secondary>Select a source class to load students.</div>';return;}fetch('/students/promote/load-students',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'class_id='+classId+'&csrf_token={{ csrf_token() }}'}).then(r=>r.text()).then(html=>container.innerHTML=html);});</script>{% endblock %}
