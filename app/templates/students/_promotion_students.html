<div class='table-responsive'><table class='table table-sm table-hover'><thead class='table-light'><tr><th><input type='checkbox' class='form-check-input' onchange='document.querySelectorAll(`.student-check`).forEach(c=>c.checked=this.checked)'></th><th>Student ID</th><th>Name</th><th>Gender</th></tr></thead><tbody>{% for s in students %}<tr><td><input type='checkbox' name='student_ids' value='{{ s.id }}' class='form-check-input student-check'></td><td>{{ s.student_id }}</td><td>{{ s.full_name }}</td><td>{{ s.gender or '-' }}</td></tr>{% else %}<tr><td colspan='4' class='text-center text-muted'>No active students in this class.</td></tr>{% endfor %}</tbody></table></div>
