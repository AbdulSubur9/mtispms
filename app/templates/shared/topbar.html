<header class="app-topbar">
    <button class="btn btn-sm btn-outline-secondary d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>

    <form class="topbar-search" action="{{ url_for('search.global_search') }}" method="get">
        <i class="bi bi-search"></i>
        <input type="search" name="q" placeholder="Search students, receipts, expenses..." value="{{ request.args.get('q', '') }}">
    </form>

    <div class="topbar-actions">
        <button class="btn btn-sm btn-outline-secondary" id="themeToggle" title="Toggle theme">
            <i class="bi bi-moon-stars"></i>
        </button>

        <div class="dropdown">
            <button class="btn btn-sm btn-outline-secondary position-relative" data-bs-toggle="dropdown">
                <i class="bi bi-bell"></i>
                {% if unread_notifications %}
                <span class="badge rounded-pill bg-danger notif-badge">{{ unread_notifications }}</span>
                {% endif %}
            </button>
            <div class="dropdown-menu dropdown-menu-end p-2" style="width: 320px;">
                <h6 class="dropdown-header">Notifications</h6>
                <div class="text-muted small px-2">You have {{ unread_notifications }} unread notification(s).</div>
            </div>
        </div>

        <div class="dropdown">
            <button class="btn btn-sm btn-light d-flex align-items-center gap-2" data-bs-toggle="dropdown">
                <span class="avatar-circle">{{ current_user.first_name[0] }}{{ current_user.last_name[0] }}</span>
                <span class="d-none d-md-inline">{{ current_user.full_name }}</span>
                <i class="bi bi-chevron-down small"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><span class="dropdown-item-text text-muted small">{{ current_user.role_label }}</span></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" href="{{ url_for('auth.change_password') }}"><i class="bi bi-key me-2"></i>Change Password</a></li>
                <li><a class="dropdown-item" href="{{ url_for('auth.logout') }}"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
            </ul>
        </div>
    </div>
</header>
